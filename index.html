<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>BarberAgenda Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-container">
    <!-- Cabecera y selector de fecha -->
    <header class="header">
      <div class="brand">
        <h1>BarberAgenda <span>Pro</span></h1>
        <p id="current-date-label">Hoy</p>
      </div>
      <div class="date-controls">
        <button type="button" id="btn-prev-day" class="btn-icon" aria-label="Día anterior">◀</button>
        <input type="date" id="date-picker" aria-label="Seleccionar fecha" />
        <button type="button" id="btn-next-day" class="btn-icon" aria-label="Día siguiente">▶</button>
      </div>
      <div class="quick-days">
        <button type="button" class="chip" data-offset="-1">Ayer</button>
        <button type="button" class="chip active" data-offset="0">Hoy</button>
        <button type="button" class="chip" data-offset="1">Mañana</button>
      </div>
    </header>

    <!-- Resumen financiero del día -->
    <section class="summary-grid">
      <div class="summary-card">
        <span class="label">Turnos</span>
        <strong id="stat-count">0</strong>
      </div>
      <div class="summary-card paid">
        <span class="label">Cobrado</span>
        <strong id="stat-paid">$ 0</strong>
      </div>
      <div class="summary-card pending">
        <span class="label">Pendiente</span>
        <strong id="stat-pending">$ 0</strong>
      </div>
    </section>

    <!-- Formulario de registro / edición -->
    <section class="card form-section">
      <h2 id="form-title">Nuevo Turno</h2>
      <form id="turno-form">
        <input type="hidden" id="turno-id" />

        <div class="form-row">
          <div class="form-group">
            <label for="turno-hora">Hora</label>
            <input type="time" id="turno-hora" required />
          </div>
          <div class="form-group flex-2">
            <label for="turno-cliente">Nombre del cliente</label>
            <input type="text" id="turno-cliente" placeholder="Ej. Carlos Pérez" required autocomplete="off" />
          </div>
        </div>

        <div class="form-group">
          <label for="turno-precio">Precio del corte (COP)</label>
          <input type="number" id="turno-precio" placeholder="20000" min="0" step="500" required />
          <div class="price-presets">
            <button type="button" class="preset-btn" data-price="15000">$15k</button>
            <button type="button" class="preset-btn" data-price="20000">$20k</button>
            <button type="button" class="preset-btn" data-price="25000">$25k</button>
            <button type="button" class="preset-btn" data-price="30000">$30k</button>
          </div>
        </div>

        <div id="form-alert" class="alert hidden"></div>

        <div class="form-actions">
          <button type="submit" id="btn-submit" class="btn-primary">Guardar Turno</button>
          <button type="button" id="btn-cancel-edit" class="btn-secondary hidden">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Lista de turnos del día -->
    <section class="list-section">
      <div class="list-header">
        <h2>Agenda del día</h2>
        <button type="button" id="btn-export-whatsapp" class="btn-outline">Copiar resumen</button>
      </div>
      <div id="turnos-list" class="turnos-list"></div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
